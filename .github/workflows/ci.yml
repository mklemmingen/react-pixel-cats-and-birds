name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install PipeWire runtime (needed by node-web-audio-api)
        run: sudo apt-get update -qq && (sudo apt-get install -y -qq libpipewire-0.3-0t64 || sudo apt-get install -y -qq libpipewire-0.3-0)
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
